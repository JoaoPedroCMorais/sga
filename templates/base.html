<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SGA{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <style>
    body { background-color: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    /* Garante área de toque mínima de 44px em mobile */
    .btn-touch { min-height: 44px; min-width: 44px; }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fs-4" href="/">
        <i class="bi bi-mortarboard-fill me-1"></i>SGA
      </a>

      <button
        class="navbar-toggler p-1"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarMain"
        aria-controls="navbarMain"
        aria-expanded="false"
        aria-label="Abrir menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link" href="#">Turmas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Chamada</a>
          </li>
        </ul>

        {% if user.is_authenticated %}
          <div class="d-flex align-items-center gap-2">
            <span class="navbar-text text-white-50 small d-none d-md-inline">
              {{ user.email }}
            </span>
            <form method="post" action="/accounts/logout/">
              {% csrf_token %}
              <button type="submit" class="btn btn-outline-light btn-sm btn-touch">
                <i class="bi bi-box-arrow-right"></i>
                <span class="d-none d-md-inline ms-1">Sair</span>
              </button>
            </form>
          </div>
        {% endif %}
      </div>
    </div>
  </nav>
  <!-- /Navbar -->

  <!-- Conteúdo principal -->
  <main class="container-fluid py-3 px-3 px-md-4">
    {% if messages %}
      {% for message in messages %}
        <div
          class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
          role="alert"
        >
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>
  <!-- /Conteúdo principal -->

  <!-- Bootstrap 5 JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmK4i35YXKqhwm8e/8o7Y2vSMFpf"
    crossorigin="anonymous"
  ></script>
  <!-- HTMX -->
  <script
    src="https://unpkg.com/htmx.org@2.0.4"
    integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+"
    crossorigin="anonymous"
  ></script>
  <!-- Alpine.js -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"
  ></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
